<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σύγκριση Τιμών - PosoKanei</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* Μενού Πλοήγησης */
        .nav { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; background: #333; padding: 10px; border-radius: 8px; }
        .nav a { color: white; text-decoration: none; font-weight: bold; padding: 10px 15px; border-radius: 5px; transition: 0.3s; }
        .nav a:hover, .nav a.active { background: #0056b3; }
        
        h1 { color: #333; text-align: center; margin-bottom: 20px; }
        .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        #search { flex: 1; min-width: 200px; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        #storeFilter { padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 4px; background-color: white; cursor: pointer; min-width: 250px; }
        .product-card { border-bottom: 1px solid #eee; padding: 15px 0; }
        .product-title { font-weight: bold; font-size: 1.1em; color: #222; }
        .product-meta { font-size: 0.9em; color: #666; margin-bottom: 10px; }
        .stores { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .store-badge { background: #e9f5ff; color: #0056b3; padding: 8px 12px; border-radius: 20px; font-size: 0.9em; display: flex; align-items: center; gap: 5px; }
        .store-badge.discount { background: #ffeaea; color: #d32f2f; border: 1px solid #ffcdd2; }
        .price { font-weight: bold; }
        .unit-price { font-size: 0.8em; color: #666; }
        .loading { text-align: center; font-size: 1.2em; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Εδώ είναι το μενού που συνδέει τις δύο σελίδες -->
        <div class="nav">
            <a href="index.html">📅 Πλάνο Γευμάτων</a>
            <a href="products.html" class="active">🔍 Σύγκριση Τιμών</a>
        </div>

        <h1>Σύγκριση Τιμών Σούπερ Μάρκετ</h1>
        
        <div class="filters">
            <input type="text" id="search" placeholder="Αναζήτηση προϊόντος (π.χ. γάλα)...">
            <select id="storeFilter">
                <option value="all">Όλα τα καταστήματα</option>
            </select>
        </div>

        <div id="results"><div class="loading">Φόρτωση δεδομένων...</div></div>
    </div>
    <script src="products.js"></script>
</body>
</html>
