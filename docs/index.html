<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Έξυπνο Πλάνο Γευμάτων</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #4CAF50;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --border-color: #333;
            --card-shadow: 0 4px 6px rgba(0,0,0,0.3);
            --btn-text: #ffffff;
            --summary-bg: linear-gradient(135deg, #1f4037, #2d5a46);
            --input-bg: #2a2a2a;
        }
        body.light-mode {
            --bg-color: #f4f7f6;
            --surface-color: #ffffff;
            --primary-color: #2e7d32;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #dddddd;
            --card-shadow: 0 4px 6px rgba(0,0,0,0.1);
            --btn-text: #ffffff;
            --summary-bg: linear-gradient(135deg, #4CAF50, #81C784);
            --input-bg: #f9f9f9;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; line-height: 1.6; transition: background-color 0.3s, color 0.3s; }
        .container { max-width: 1100px; margin: auto; }
        header { text-align: center; margin-bottom: 30px; position: relative; }
        h1 { color: var(--text-main); margin-bottom: 5px; }
        .subtitle { color: var(--text-muted); font-size: 0.9em; margin-bottom: 20px; }
        
        /* Κουμπί ΜΟΝΟ με εικονίδιο */
        .theme-toggle { position: absolute; top: 0; right: 0; background: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 0; border-radius: 50%; cursor: pointer; font-size: 1.5em; box-shadow: var(--card-shadow); transition: 0.3s; display: flex; align-items: center; justify-content: center; width: 45px; height: 45px; }
        .theme-toggle:hover { background: var(--border-color); }

        .store-selector { background: var(--surface-color); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-color); box-shadow: var(--card-shadow); transition: 0.3s; }
        .store-selector h3 { margin-top: 0; font-size: 1.1em; color: var(--primary-color); }
        .stores-grid { display: flex; flex-wrap: wrap; gap: 15px; }
        .store-checkbox { display: flex; align-items: center; gap: 8px; cursor: pointer; background: var(--input-bg); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); transition: 0.2s; color: var(--text-main); }
        .store-checkbox:hover { border-color: var(--primary-color); }
        .store-checkbox input { accent-color: var(--primary-color); transform: scale(1.2); cursor: pointer; }

        .week-summary { display: flex; justify-content: space-around; background: var(--summary-bg); padding: 20px; border-radius: 12px; margin-bottom: 30px; text-align: center; box-shadow: var(--card-shadow); transition: 0.3s; }
        .summary-item { font-size: 1.2em; font-weight: bold; color: #ffffff; }
        .summary-value { color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.2); font-size: 1.5em; display: block; margin-top: 5px; }

        .main-layout { display: flex; gap: 30px; flex-wrap: wrap; }
        .meal-plan-column { flex: 2; min-width: 300px; }
        .shopping-column { flex: 1; min-width: 300px; }

        .day-card { background: var(--surface-color); border-radius: 12px; padding: 20px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); box-shadow: var(--card-shadow); transition: 0.3s; }
        .day-title { font-weight: bold; font-size: 1.2em; color: var(--text-main); margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .meal { margin-bottom: 8px; color: var(--text-main); }
        .meal-type { font-weight: bold; color: var(--primary-color); width: 110px; display: inline-block; }

        .shopping-card { background: var(--surface-color); border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); box-shadow: var(--card-shadow); position: sticky; top: 20px; transition: 0.3s; }
        .shopping-card h2 { margin-top: 0; color: var(--text-main); font-size: 1.2em; border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .shopping-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--border-color); }
        .shopping-item:last-child { border-bottom: none; }
        .item-info strong { display: block; color: var(--text-main); }
        .item-info small { color: var(--text-muted); font-size: 0.8em; }
        .item-price { text-align: right; }
        .price-tag { color: var(--primary-color); font-weight: bold; font-size: 1.1em; display: block; }
        .store-tag { font-size: 0.75em; color: var(--text-muted); background: var(--input-bg); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-color); }

        .btn-print { background: var(--primary-color); color: var(--btn-text); border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 1em; width: 100%; margin-top: 20px; font-weight: bold; transition: 0.2s; }
        .btn-print:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">☀️</button>
            <h1>🍲 Έξυπνο Πλάνο Γευμάτων</h1>
            <div class="subtitle">Οργάνωσε το μενού της εβδομάδας και βρες πού θα ψωνίσεις φθηνότερα.</div>
        </header>

        <div class="store-selector" id="store-filters">
            <h3>Διάλεξε καταστήματα για σύγκριση:</h3>
            <div class="stores-grid" id="stores-grid"></div>
        </div>

        <div class="week-summary">
            <div class="summary-item">Συνολικό Κόστος <span class="summary-value" id="total-cost">0.00€</span></div>
            <div class="summary-item">Ανά άτομο / ημέρα <span class="summary-value" id="cost-per-day">0.00€</span></div>
        </div>

        <div class="main-layout">
            <div class="meal-plan-column" id="meal-plan"></div>
            <div class="shopping-column">
                <div class="shopping-card">
                    <h2>🛒 Λίστα Αγορών</h2>
                    <div id="shopping-list-items"></div>
                    <button class="btn-print" onclick="window.print()">Εκτύπωση / PDF</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
