name: Ενημέρωση προσφορών Lidl

on:
  schedule:
    - cron: "0 4 * * *"   # κάθε μέρα 07:00 ώρα Ελλάδας
  workflow_dispatch:       # και με το χέρι από την καρτέλα Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Διάβασμα προσφορών
        run: python scraper.py
      - name: Αποθήκευση
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/offers.json
          git diff --cached --quiet || git commit -m "Ενημέρωση προσφορών"
          git push
