name: Update PosoKanei Catalog

on:
  workflow_dispatch: # Χειροκίνητη εκτέλεση για δοκιμή
  schedule:
    - cron: '0 3 * * *' # Αυτόματη εκτέλεση κάθε μέρα στις 03:00 τα ξημερώματα

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run collector
        run: python collectors/posokanei_catalog.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add docs/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Αυτόματη ενημέρωση τιμών από PosoKanei" && git push)
